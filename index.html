<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מירוץ העולמות</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0b1e;overflow:hidden;font-family:Arial,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:6px}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,10,30,.55);color:#fff;text-align:center;padding:16px}
  .hidden{display:none !important}
  h1{margin:0;font-size:clamp(30px,6vw,64px);color:#ffd400;text-shadow:0 4px 0 #000,0 0 18px rgba(255,212,0,.6);font-weight:900}
  h2{margin:0;font-size:clamp(22px,4vw,38px);color:#ffd400;text-shadow:0 3px 0 #000;font-weight:900}
  p{margin:0;font-size:clamp(15px,2.4vw,22px);text-shadow:0 2px 0 #000}
  .btn{font:900 clamp(16px,3vw,26px) Arial,sans-serif;color:#222;background:#ffd400;border:4px solid #000;border-radius:18px;padding:10px 26px;box-shadow:0 6px 0 #000;cursor:pointer;min-width:160px}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
  .btn:disabled{background:#777;color:#444;cursor:not-allowed}
  .btn.alt{background:#fff}
  .btn.small{min-width:0;padding:6px 14px;font-size:15px;box-shadow:0 3px 0 #000;border-width:3px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px;width:min(92%,660px)}
  .lvl{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;color:#222;border:4px solid #000;border-radius:16px;padding:8px 6px;box-shadow:0 5px 0 #000;cursor:pointer;font-weight:900;font-family:Arial,sans-serif}
  .lvl:disabled{opacity:.55;cursor:not-allowed}
  .lvl .n{font-size:clamp(20px,3.4vw,30px);color:#ff9800;text-shadow:0 2px 0 #000}
  .lvl .t{font-size:clamp(11px,1.7vw,15px)}
  .lvl .r{font-size:clamp(11px,1.6vw,14px);color:#2e7d32;min-height:16px}
  #ctrls{--s:clamp(64px,9vw,84px);position:absolute;inset:0;pointer-events:none}
  .ctrl{position:absolute;bottom:14px;width:var(--s);height:var(--s);border-radius:50%;border:4px solid #000;background:rgba(255,212,0,.9);color:#222;font-size:clamp(24px,4vw,36px);font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #000;pointer-events:auto;padding:0;touch-action:none}
  .ctrl.on{transform:translateY(3px) scale(.94);background:#fff;box-shadow:0 2px 0 #000}
  #bLeft{left:16px}
  #bRight{left:calc(16px + var(--s) + 12px)}
  #bGas{right:16px}
  #bBrake{right:calc(16px + var(--s) + 12px)}
  #btnMenu{position:absolute;top:62px;left:16px;pointer-events:auto}
  #btnSound{position:absolute;top:62px;right:16px;pointer-events:auto}
  #rot{display:none !important;background:#0b0b1e;z-index:9}
  @media (orientation:portrait){ #rot{display:flex !important} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="scr-loading" class="screen">
    <h2>טוען משחק...</h2>
    <p id="loadTxt">0%</p>
  </div>

  <div id="scr-start" class="screen hidden">
    <h1>מירוץ העולמות</h1>
    <p>שלוט במכונית, קפוץ מעל האש, וסיים במקום הכי גבוה!</p>
    <button class="btn" id="btnStart">התחל</button>
  </div>

  <div id="scr-select" class="screen hidden">
    <h2>בחר שלב</h2>
    <div class="grid" id="grid"></div>
    <button class="btn alt" id="btnBack">חזרה</button>
  </div>

  <div id="scr-finish" class="screen hidden">
    <h2 id="finTitle"></h2>
    <p id="finMsg"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="btnNext">שלב הבא</button>
      <button class="btn alt" id="btnRetry">שחק שוב</button>
      <button class="btn alt" id="btnSelect">בחירת שלב</button>
    </div>
  </div>

  <div id="ctrls" class="hidden">
    <button class="ctrl" id="bLeft">◀</button>
    <button class="ctrl" id="bRight">▶</button>
    <button class="ctrl" id="bGas">▲</button>
    <button class="ctrl" id="bBrake">▼</button>
    <button class="btn alt small" id="btnMenu">תפריט</button>
    <button class="btn alt small" id="btnSound">🔊 צליל</button>
  </div>

  <div id="rot" class="screen"><h2>סובב את המכשיר לרוחב</h2></div>
</div>

<script>
/* ========================= הגדרות תצוגה ========================= */
const W = 960, H = 540;
const HORIZON = 216;               // קו האופק (פיקסלים)
const F = 200;                     // מרחק מוקד - קובע את גודל הדברים במרחק
const CAM_H = 400;                 // גובה המצלמה
const K = F * CAM_H;               // מיקום שורה על המסך = HORIZON + K / עומק
const CAM_BACK = 300;              // המצלמה נמצאת מאחורי השחקן
const MIN_DEPTH = 8, MAX_DEPTH = 6000;
const CAR_W = 177;                 // רוחב מכונית בעולם (בעומק 300 זה 118 פיקסלים)
const KERB = 28;                   // רוחב שפת הכביש
const RAMP = 60, FIRE = 70, FLAME_H = 90;
const JUMP_SPEED = 260, JUMP_TIME = 0.6, MAX_SPEED = 520, STUN_TIME = 0.6;
const CAR_SQUASH = 0.5;            // כיווץ אנכי של תמונת המכונית כדי שתיראה שוכבת על הכביש

const WORLDS = [
  { name: 'Candy Land Raceway',       file: 'assets/world_1_candy.jpg' },
  { name: 'Dinosaur Jungle Safari',   file: 'assets/world_2_dino.jpg' },
  { name: 'Underwater Atlantis',      file: 'assets/world_3_atlantis.jpg' },
  { name: 'Outer Space Odyssey',      file: 'assets/world_4_space.jpg' },
  { name: 'Frozen Winter Wonderland', file: 'assets/world_5_frozen.jpg' },
  { name: 'Fairytale Kingdom',        file: 'assets/world_6_fairytale.jpg' },
  { name: 'Monster City Mayhem',      file: 'assets/world_7_monster_city.jpg' },
  { name: 'Pirate Cove Adventure',    file: 'assets/world_8_pirate.jpg' },
  { name: 'Volcanic Fire Circuit',    file: 'assets/world_9_volcano.jpg' }
];

// המכונית הראשונה היא מכונית השחקן. השאר הם היריבים.
// fast = מתחרה על המקום הראשון, slow = נוסע לאט יותר.
const CARS = [
  { id: 'player', file: 'assets/car_5_player.png', player: true },
  { id: 'P1', file: 'assets/car_p1_chococo.png', group: 'fast', lane: -0.6 },
  { id: '2',  file: 'assets/car_2_scorpion.png', group: 'fast', lane: 0.6 },
  { id: '3',  file: 'assets/car_3_purple.png',   group: 'fast', lane: -0.2 },
  { id: '4',  file: 'assets/car_4_dinofuel.png', group: 'slow', lane: 0.3 },
  { id: '6',  file: 'assets/car_6_flame.png',    group: 'slow', lane: -0.45 }
];

/* ========================= מצב ========================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const IMG = {};
const input = { left: false, right: false, up: false, down: false };
let G = null;
let menuLvl = null;
let idleT = 0;
let curStage = 1;
let maxUnlocked = 1;
let results = {};

/* ========================= עזרים ========================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
function centerOffset(z, lvl) { return lvl.amp * Math.sin(z * lvl.freq); }
function proj(X, depth, camX) { return W / 2 + (X - camX) * F / depth; }
function groundY(depth) { return HORIZON + K / depth; }
function airborne(c) { return G && G.t <= c.airUntil; }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function outlinedText(txt, x, y, color, size, stroke) {
  ctx.font = `900 ${size}px Arial, sans-serif`;
  ctx.lineJoin = 'round';
  ctx.lineWidth = stroke || 6;
  ctx.strokeStyle = '#000';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}

/* ========================= יצירת שלב ========================= */
function makeLevel(s) {
  const L = 25000 + s * 2500;        // אורך מסלול (ארוך בהרבה מהגרסה הקודמת)
  const n = s + 1;                   // מכשולי אש: שלב 1 = 2, שלב 9 = 10
  const start = 1200, end = L - 900;
  const sp = (end - start) / n;
  const obs = [];
  for (let i = 0; i < n; i++) {
    const f = start + sp * (i + 0.5) + rnd(-0.2, 0.2) * sp;
    obs.push({ fireStart: f, rampStart: f - RAMP, fireEnd: f + FIRE });
  }
  return {
    stage: s, L, obs,
    amp: 110 + s * 32,               // עוצמת הפניות: עולה משלב לשלב
    freq: 0.0013 + s * 0.00033,      // תדירות הפניות: הפניות חדות יותר בשלבים גבוהים
    half: 260 - s * 7                // חצי רוחב הכביש (נהיה צר יותר)
  };
}

function makeCars() {
  return CARS.map((def, i) => ({
    def, id: def.id, isPlayer: !!def.player,
    d: def.player ? 0 : -30 * i,
    lat: 0, speed: 0,
    group: def.group, laneBase: def.lane || 0, phase: i * 1.7,
    target: 0, targetT: 0,
    stun: 0, airUntil: -1, ramp: [], fire: [],
    jumps: 0, hits: 0, bumpCd: 0, finishTime: null
  }));
}

function pickTarget(c, s) {
  const base = c.group === 'fast' ? 430 + s * 9 : 320 + s * 7;
  return base * rnd(0.95, 1.05);
}

/* ========================= צלילים (נוצרים בקוד, בלי קבצים) ========================= */
let AC = null, master = null, noiseBuf = null, engGain = null, engFilter = null;
let engOsc1 = null, engOsc2 = null;
let sfxOn = true;

function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.7;
    master.connect(AC.destination);

    // רעש הרכב
    engFilter = AC.createBiquadFilter();
    engFilter.type = 'lowpass';
    engFilter.frequency.value = 500;
    engFilter.connect(master);
    engGain = AC.createGain();
    engGain.gain.value = 0;
    engGain.connect(engFilter);
    engOsc1 = AC.createOscillator();
    engOsc1.type = 'sawtooth';
    engOsc1.frequency.value = 60;
    engOsc1.connect(engGain);
    engOsc1.start();
    const g2 = AC.createGain();
    g2.gain.value = 0.35;
    g2.connect(engGain);
    engOsc2 = AC.createOscillator();
    engOsc2.type = 'square';
    engOsc2.frequency.value = 120;
    engOsc2.connect(g2);
    engOsc2.start();

    // רעש לבן לאפקטים
    const len = AC.sampleRate;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}

function updateEngine(speed, racing) {
  if (!AC) return;
  const t = AC.currentTime;
  const on = racing && sfxOn;
  const target = on ? 0.03 + 0.06 * (speed / MAX_SPEED) : 0;
  engGain.gain.setTargetAtTime(target, t, 0.1);
  engOsc1.frequency.setTargetAtTime(50 + speed * 0.22, t, 0.08);
  engOsc2.frequency.setTargetAtTime(100 + speed * 0.44, t, 0.08);
  engFilter.frequency.setTargetAtTime(350 + speed * 2.2, t, 0.1);
}

function noiseBurst(dur, freqFrom, freqTo, gain, type) {
  if (!AC || !sfxOn) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = type || 'bandpass';
  f.frequency.setValueAtTime(freqFrom, t);
  f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
  src.stop(t + dur + 0.05);
}

function tone(type, f0, f1, dur, gain) {
  if (!AC || !sfxOn) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function sfxJump() {           // קפיצה: צליל עולה + רוח
  tone('triangle', 260, 900, 0.32, 0.25);
  noiseBurst(0.35, 800, 3000, 0.25, 'bandpass');
}
function sfxLand() {           // נחיתה: דפיקה נמוכה
  tone('sine', 130, 45, 0.25, 0.4);
}
function sfxHit() {            // פגיעה באש: פיצוץ קצר
  noiseBurst(0.45, 2500, 400, 0.5, 'bandpass');
  tone('square', 110, 40, 0.3, 0.25);
}

/* ========================= לוגיקה ========================= */
function toast(msg) { if (G) { G.toast = msg; G.toastT = 1.6; } }

function processObstacles(c) {
  const obs = G.lvl.obs;
  for (let i = 0; i < obs.length; i++) {
    const o = obs[i];
    if (!c.ramp[i] && c.d >= o.rampStart) {
      c.ramp[i] = true;
      if (c.speed >= JUMP_SPEED) {
        c.airUntil = G.t + JUMP_TIME;
        if (c.isPlayer) { toast('קפיצה!'); sfxJump(); }
      } else if (c.isPlayer) {
        toast('נסיעה מהירה יותר תעזור לקפוץ!');
      }
    }
    if (!c.fire[i] && c.d >= o.fireStart) {
      c.fire[i] = true;
      if (airborne(c)) {
        c.jumps++;
      } else {
        c.stun = STUN_TIME;
        c.speed = Math.min(c.speed, 140);
        c.hits++;
        if (c.isPlayer) { toast('אוי! האש האטה אותך'); sfxHit(); }
      }
    }
  }
}

function step(dt) {
  const L = G.lvl.L;
  G.t += dt;

  for (const c of G.cars) {
    if (c.stun > 0) c.stun -= dt;

    if (c.isPlayer) {
      if (c.finishTime === null) {
        if (input.up && c.stun <= 0) c.speed += 260 * dt;
        else if (input.down) c.speed -= 380 * dt;
        else c.speed -= 70 * dt;
        c.speed = clamp(c.speed, 0, MAX_SPEED);
        c.lat = clamp(c.lat + ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * 1.1 * dt, -0.9, 0.9);
      }
    } else {
      if (c.finishTime === null) {
        c.targetT -= dt;
        if (c.targetT <= 0) { c.target = pickTarget(c, G.lvl.stage); c.targetT = rnd(2.5, 4); }
        c.speed += clamp(c.target - c.speed, -220 * dt, 220 * dt);
        c.speed = clamp(c.speed, 0, MAX_SPEED);
      }
      c.lat = clamp(c.laneBase + 0.3 * Math.sin(G.t * 0.9 + c.phase), -0.85, 0.85);
    }

    if (c.stun > 0) c.speed = Math.min(c.speed, 170);

    if (c.finishTime === null) {
      c.d += c.speed * dt;
      if (c.d >= L) {
        c.d = L; c.speed = 0; c.finishTime = G.t;
        if (c.isPlayer && G.phase === 'race') { G.phase = 'finishing'; G.endTimer = 1.4; }
      }
    }
    processObstacles(c);
  }

  // צליל נחיתה לשחקן
  const p = G.cars[0];
  const airNow = airborne(p);
  if (G.wasAir && !airNow) sfxLand();
  G.wasAir = airNow;

  // התנגשות קלה עם יריב
  if (p.bumpCd > 0) p.bumpCd -= dt;
  if (p.finishTime === null) {
    for (let i = 1; i < G.cars.length; i++) {
      const r = G.cars[i];
      if (r.finishTime !== null) continue;
      if (Math.abs(r.d - p.d) < 60 && Math.abs(r.lat - p.lat) < 0.45 &&
          p.bumpCd <= 0 && !airborne(r) && !airNow) {
        p.speed *= 0.65;
        p.bumpCd = 0.9;
        toast('פגיעה! האטה קלה');
      }
    }
  }
}

function ranking() {
  return G.cars.slice().sort((a, b) => {
    const fa = a.finishTime !== null, fb = b.finishTime !== null;
    if (fa && fb) return a.finishTime - b.finishTime;
    if (fa) return -1;
    if (fb) return 1;
    return b.d - a.d;
  });
}

/* ========================= ציור תלת-ממדי ========================= */
function drawSky(stage) {
  const im = IMG[WORLDS[stage - 1].file];
  const iw = im.naturalWidth, ih = im.naturalHeight * 0.85;
  const sc = Math.max(W / iw, H / ih), dw = iw * sc, dh = ih * sc;
  ctx.drawImage(im, 0, 0, iw, ih, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, 0, W, H);
}

function drawRoad(camZ, camX, lvl) {

  const hw = lvl.half;
  for (let y = HORIZON + 1; y < H; y += 2) {
    const depth = K / (y - HORIZON);
    const z = camZ + depth;
    const cW = centerOffset(z, lvl);
    const xl = proj(cW - hw, depth, camX), xr = proj(cW + hw, depth, camX);
    const xkl = proj(cW - hw - KERB, depth, camX), xkr = proj(cW + hw + KERB, depth, camX);

    // שפות אדומות-לבנות
    ctx.fillStyle = Math.floor(z / 30) % 2 === 0 ? '#ff3b3b' : '#f5f5f5';
    ctx.fillRect(xkl, y, xl - xkl + 1, 2);
    ctx.fillRect(xr - 1, y, xkr - xr + 1, 2);

    // הכביש עצמו
    ctx.fillStyle = Math.floor(z / 60) % 2 === 0 ? '#4b4b5e' : '#41414f';
    ctx.fillRect(xl, y, xr - xl, 2);

    // קו מקווקו במרכז
    if (Math.floor(z / 50) % 2 === 0) {
      const cx = proj(cW, depth, camX);
      const dash = Math.max(2, 12 * F / depth);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(cx - dash / 2, y, dash, 2);
    }
  }
}

function buildItems(dp, lvl, cars, t, camZ, camX) {
  const items = [];
  const hw = lvl.half;

  // קווי זינוק וסיום
  for (const [zLine, label] of [[0, 'זינוק'], [lvl.L, 'סיום']]) {
    const depth = zLine - camZ;
    if (depth < MIN_DEPTH || depth > MAX_DEPTH) continue;
    items.push({ depth, fn: () => {
      const y = groundY(depth);
      const cW = centerOffset(zLine, lvl);
      const cells = 12, cw = 2 * hw / cells;
      for (let i = 0; i < cells; i++) {
        const x1 = proj(cW - hw + i * cw, depth, camX);
        const x2 = proj(cW - hw + (i + 1) * cw, depth, camX);
        ctx.fillStyle = i % 2 ? '#111' : '#fff';
        ctx.fillRect(x1, y - 8 * F / depth, x2 - x1, 16 * F / depth);
      }
      const cx = proj(cW, depth, camX);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      outlinedText(label, cx, y - 14 * F / depth, '#ffd400', clamp(26 * F / depth, 12, 34), 5);
    }});
  }

  // מכשולים: רמפה ואש
  for (const o of lvl.obs) {
    const dRamp = o.rampStart - camZ, dFire = o.fireStart - camZ, dEnd = o.fireEnd - camZ;
    if (dEnd < MIN_DEPTH || dRamp > MAX_DEPTH) continue;
    items.push({ depth: Math.max(dFire, MIN_DEPTH), fn: () => {
      const dN = Math.max(dRamp, MIN_DEPTH), dF = Math.max(dFire, MIN_DEPTH), dE = Math.max(dEnd, MIN_DEPTH);
      const cWn = centerOffset(o.rampStart, lvl), cWf = centerOffset(o.fireStart, lvl), cWe = centerOffset(o.fireEnd, lvl);

      // הרמפה
      const gr = ctx.createLinearGradient(0, groundY(dF), 0, groundY(dN));
      gr.addColorStop(0, '#ffe08a');
      gr.addColorStop(1, '#e07b1a');
      ctx.beginPath();
      ctx.moveTo(proj(cWn - hw, dN, camX), groundY(dN));
      ctx.lineTo(proj(cWn + hw, dN, camX), groundY(dN));
      ctx.lineTo(proj(cWf + hw * 0.85, dF, camX), groundY(dF));
      ctx.lineTo(proj(cWf - hw * 0.85, dF, camX), groundY(dF));
      ctx.closePath();
      ctx.fillStyle = gr;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();

      // זוהר האש
      ctx.beginPath();
      ctx.moveTo(proj(cWf - hw, dF, camX), groundY(dF));
      ctx.lineTo(proj(cWf + hw, dF, camX), groundY(dF));
      ctx.lineTo(proj(cWe + hw, dE, camX), groundY(dE));
      ctx.lineTo(proj(cWe - hw, dE, camX), groundY(dE));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,90,0,0.35)';
      ctx.fill();

      // הלהבות (שתי שורות בעומקים שונים)
      const cols = 16;
      const slices = [dE, (dF + dE) / 2, dF];
      for (const ds of slices) {
        const cWs = centerOffset(camZ + ds, lvl);
        const colW = (2 * hw) / cols;
        const fwPx = colW * F / ds * 1.15;
        const baseY = groundY(ds);
        for (let i = 0; i < cols; i++) {
          const X = cWs - hw + (i + 0.5) * colW;
          const x = proj(X, ds, camX);
          const fh = FLAME_H * F / ds * (0.75 + 0.35 * Math.abs(Math.sin(t * 9 + i * 1.3 + ds * 0.01)));
          ctx.fillStyle = '#ff6a00';
          ctx.beginPath();
          ctx.moveTo(x - fwPx * 0.7, baseY);
          ctx.quadraticCurveTo(x, baseY - fh * 0.6, x, baseY - fh);
          ctx.quadraticCurveTo(x, baseY - fh * 0.6, x + fwPx * 0.7, baseY);
          ctx.fill();
          ctx.fillStyle = '#ffd400';
          ctx.beginPath();
          ctx.moveTo(x - fwPx * 0.35, baseY);
          ctx.quadraticCurveTo(x, baseY - fh * 0.4, x, baseY - fh * 0.6);
          ctx.quadraticCurveTo(x, baseY - fh * 0.4, x + fwPx * 0.35, baseY);
          ctx.fill();
        }
      }
    }});
  }

  // מכוניות
  for (const c of cars) {
    const depth = c.d - camZ;
    if (depth < MIN_DEPTH || depth > MAX_DEPTH) continue;
    items.push({ depth, fn: () => {
      const X = centerOffset(c.d, lvl) + c.lat * hw;
      const sx = proj(X, depth, camX);
      const gy = groundY(depth);
      const img = IMG[c.def.file];
      const k = airborne(c) ? Math.sin(clamp((t - (c.airUntil - JUMP_TIME)) / JUMP_TIME, 0, 1) * Math.PI) : 0;
      const w = CAR_W * F / depth * (1 + 0.1 * k) + (c.isPlayer ? 3 : 0);
      const h = w * img.naturalHeight / img.naturalWidth;
      const lift = k * w * 0.3;

      // צל על הכביש
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(sx, gy, w * 0.45 * (1 - 0.3 * k), Math.max(2, w * 0.07 * (1 - 0.4 * k)), 0, 0, Math.PI * 2);
      ctx.fill();

      // המכונית (מסובבת כך שהחרטום פונה קדימה)
      // התמונות מבט מלמעלה והחרטום כבר פונה קדימה, לכן רק מכווצים אנכית כדי שייראו שוכבות על הכביש
      const sq = CAR_SQUASH;
      ctx.save();
      ctx.translate(sx, gy - lift - (h * sq) / 2);
      ctx.scale(1, sq);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();

      if (c.isPlayer) {
        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText('אתה').width + 18;
        const ty = gy - h * sq - lift - 14;
        ctx.fillStyle = '#ffd400';
        rr(sx - tw / 2, ty - 13, tw, 26, 10);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#222';
        ctx.fillText('אתה', sx, ty);
      }
    }});
  }
  return items;
}

function drawScene(dp, lvl, cars, t, lat) {
  const camZ = dp - CAM_BACK;
  const camX = centerOffset(camZ, lvl) + 0.5 * lat * lvl.half;
  drawSky(lvl.stage);
  drawRoad(camZ, camX, lvl);
  const items = buildItems(dp, lvl, cars || [], t, camZ, camX);
  items.sort((a, b) => b.depth - a.depth);   // רחוק קודם, קרוב אחר כך
  for (const it of items) it.fn();
}

function drawHUD() {
  const p = G.cars[0], L = G.lvl.L;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, 52);
  ctx.textBaseline = 'middle';

  const rank = ranking().indexOf(p) + 1;
  ctx.textAlign = 'left';
  ctx.font = '900 22px Arial, sans-serif';
  ctx.fillStyle = '#ffd400';
  ctx.fillText(`מקום ${rank} מתוך 6`, 16, 27);

  ctx.textAlign = 'right';
  ctx.font = 'bold 17px Arial, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(`שלב ${G.lvl.stage} מתוך 9`, W - 16, 27);

  const bx = 200, bw = W - 400, by = 27;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  rr(bx, by - 5, bw, 10, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,212,0,0.7)';
  rr(bx, by - 5, bw * clamp(p.d / L, 0, 1), 10, 5); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(bx + bw + 4, by - 12, 4, 24);

  for (let i = G.cars.length - 1; i >= 0; i--) {
    const c = G.cars[i], img = IMG[c.def.file];
    const mx = bx + clamp(c.d / L, 0, 1) * bw;
    const cw = c.isPlayer ? 40 : 34, chh = c.isPlayer ? 26 : 22;
    ctx.fillStyle = c.isPlayer ? '#ffd400' : '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    rr(mx - cw / 2, by - chh / 2, cw, chh, 6);
    ctx.fill(); ctx.stroke();
    const sc = Math.min((cw - 6) / img.naturalWidth, (chh - 4) / img.naturalHeight);
    const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
    ctx.drawImage(img, mx - iw / 2, by - ih / 2, iw, ih);
  }
}

function drawCountdown() {
  const txt = G.cd > 0 ? String(Math.ceil(G.cd)) : 'יאללה!';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  outlinedText(txt, W / 2, H * 0.4, '#ffd400', G.cd > 0 ? 120 : 90, 12);
}

function drawToast() {
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(G.toast).width + 36;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  rr(W / 2 - tw / 2, 72, tw, 38, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(G.toast, W / 2, 91);
}

/* ========================= לולאה ראשית ========================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (G && G.phase !== 'done') {
    G.toastT = Math.max(0, G.toastT - dt);
    if (G.phase === 'countdown') {
      G.t += dt;
      G.cd -= dt;
      if (G.cd <= -0.6) G.phase = 'race';
    } else {
      step(dt);
      if (G.phase === 'finishing') {
        G.endTimer -= dt;
        if (G.endTimer <= 0) endRace();
      }
    }
  }

  // צליל המנוע
  if (G) updateEngine(G.cars[0].speed, G.phase === 'race' || G.phase === 'finishing');
  else updateEngine(0, false);

  ctx.clearRect(0, 0, W, H);
  if (G) {
    const p = G.cars[0];
    drawScene(p.d, G.lvl, G.cars, G.t, p.lat);
    if (G.phase !== 'done') drawHUD();
    if (G.phase === 'countdown') drawCountdown();
    if (G.toastT > 0 && G.phase !== 'done') drawToast();
  } else {
    idleT += dt;
    drawScene((idleT * 90) % (menuLvl.L - 300) + 100, menuLvl, null, idleT, 0);
  }
  requestAnimationFrame(frame);
}

/* ========================= ניהול מסכים ========================= */
function showScreen(id) {
  ['scr-loading', 'scr-start', 'scr-select', 'scr-finish'].forEach(x => {
    document.getElementById(x).classList.toggle('hidden', x !== id);
  });
}

function resetInput() {
  input.left = input.right = input.up = input.down = false;
  document.querySelectorAll('.ctrl').forEach(b => b.classList.remove('on'));
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let s = 1; s <= 9; s++) {
    const locked = s > maxUnlocked;
    const b = document.createElement('button');
    b.className = 'lvl';
    b.disabled = locked;
    b.innerHTML =
      `<div class="n">${s}</div>` +
      `<div class="t">${WORLDS[s - 1].name}</div>` +
      `<div class="r">${locked ? '🔒' : (results[s] ? 'מקום ' + results[s] : '')}</div>`;
    b.onclick = () => startRace(s);
    grid.appendChild(b);
  }
}

function showSelect() {
  G = null;
  resetInput();
  menuLvl = makeLevel(curStage);
  buildGrid();
  document.getElementById('ctrls').classList.add('hidden');
  showScreen('scr-select');
}

function startRace(s) {
  audioInit();
  curStage = s;
  const lvl = makeLevel(s);
  G = { lvl, cars: makeCars(), t: 0, phase: 'countdown', cd: 3,
        toast: '', toastT: 0, endTimer: 0, wasAir: false };
  resetInput();
  showScreen(null);
  document.getElementById('ctrls').classList.remove('hidden');
}

function endRace() {
  G.phase = 'done';
  const rank = ranking().indexOf(G.cars[0]) + 1;
  const s = G.lvl.stage;
  results[s] = results[s] ? Math.min(results[s], rank) : rank;
  if (s === maxUnlocked && maxUnlocked < 9) maxUnlocked++;
  save();
  showFinish(rank);
}

function showFinish(rank) {
  const s = G.lvl.stage;
  const titles = ['🏆 מקום ראשון!', '🥈 מקום שני!', '🥉 מקום שלישי!'];
  document.getElementById('finTitle').textContent = rank <= 3 ? titles[rank - 1] : `מקום ${rank} מתוך 6`;
  document.getElementById('finMsg').textContent =
    rank === 1 ? 'מדהים! ניצחת את כולם' :
    rank <= 3 ? 'כמעט! עוד קצת והיית הראשון' :
    'נסה שוב כדי לשפר את המקום';
  document.getElementById('btnNext').classList.toggle('hidden', s >= 9);
  document.getElementById('ctrls').classList.add('hidden');
  showScreen('scr-finish');
}

/* ========================= שמירה ========================= */
function save() {
  try { localStorage.setItem('racerProgress', JSON.stringify({ maxUnlocked, results })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('racerProgress') || 'null');
    if (d) {
      maxUnlocked = clamp(d.maxUnlocked || 1, 1, 9);
      results = d.results || {};
    }
  } catch (e) {}
}

/* ========================= קלט ========================= */
const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
window.addEventListener('keydown', e => {
  if (keyMap[e.key]) { input[keyMap[e.key]] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if (keyMap[e.key]) { input[keyMap[e.key]] = false; e.preventDefault(); }
});
window.addEventListener('blur', resetInput);

function bindBtn(id, dir) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); audioInit(); input[dir] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); input[dir] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bLeft', 'left');
bindBtn('bRight', 'right');
bindBtn('bGas', 'up');
bindBtn('bBrake', 'down');

document.getElementById('btnStart').onclick = () => { audioInit(); showSelect(); };
document.getElementById('btnBack').onclick = () => { G = null; showScreen('scr-start'); };
document.getElementById('btnNext').onclick = () => startRace(Math.min(9, curStage + 1));
document.getElementById('btnRetry').onclick = () => startRace(curStage);
document.getElementById('btnSelect').onclick = showSelect;
document.getElementById('btnMenu').onclick = showSelect;
document.getElementById('btnSound').onclick = e => {
  sfxOn = !sfxOn;
  e.currentTarget.textContent = sfxOn ? '🔊 צליל' : '🔇 מושתק';
  if (!sfxOn) updateEngine(0, false);
};

/* ========================= טעינה והפעלה ========================= */
function loadOne(f) {
  return new Promise((res, rej) => {
    const im = new Image();
    const timer = setTimeout(() => rej(new Error('טעינה ארכה יותר מדי: ' + f)), 15000);
    im.onload = () => { clearTimeout(timer); IMG[f] = im; res(f); };
    im.onerror = () => { clearTimeout(timer); rej(new Error('לא נמצא הקובץ ' + f)); };
    im.src = f;
  });
}

function loadAssets() {
  const files = [...WORLDS.map(w => w.file), ...CARS.map(c => c.file)];
  const txt = document.getElementById('loadTxt');
  let n = 0;
  const tracked = files.map(f => loadOne(f).then(() => {
    n++;
    txt.textContent = Math.round(n / files.length * 100) + '%';
  }));
  return Promise.all(tracked);
}

loadAssets().then(() => {
  load();
  menuLvl = makeLevel(1);
  showScreen('scr-start');
  requestAnimationFrame(frame);
}).catch(e => {
  document.getElementById('loadTxt').textContent = 'שגיאה בטעינה: ' + e.message;
  document.getElementById('loadTxt').style.color = '#ff8a80';
});
</script>
